<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin tức Nông nghiệp - Sổ tay Nông dân số</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .news-card { 
            background: white; border-radius: var(--radius-lg); border: 1px solid var(--slate-200); 
            overflow: hidden; transition: var(--transition); box-shadow: var(--shadow-sm); 
            display: flex; flex-direction: column; cursor: pointer; text-decoration: none; color: inherit;
        }
        .news-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--emerald-300); }
        .nc-img { width: 100%; height: 200px; background-size: cover; background-position: center; border-bottom: 1px solid var(--slate-100);}
        .nc-content { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .nc-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--slate-500); margin-bottom: 10px; }
        .nc-title { font-size: 1.15rem; font-weight: 700; color: var(--slate-900); margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .nc-desc { font-size: 0.95rem; color: var(--slate-600); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 16px; }
        .nc-readmore { margin-top: auto; color: var(--emerald-600); font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body class="dashboard-page">
    <div class="saas-dashboard">
        <!-- Sidebar -->
        <aside class="dash-sidebar">
            <button id="sidebarToggleBtn" class="floating-toggle-btn"><i class="fa-solid fa-angle-left" id="toggleIcon"></i></button>
            <div class="sidebar-content-wrapper">
                <div class="dash-profile">
                    <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Avatar">
                    <div class="dash-profile-info">
                        <strong id="user-name-display">Người dùng</strong>
                        <span class="badge badge-farmer" id="user-role-display">Nông dân</span>
                    </div>
                </div>
                <nav class="dash-nav">
                    <a href="dashboard.html"><i class="fa-solid fa-house"></i> <span>Tổng quan</span></a>
                    <a href="weather.html"><i class="fa-solid fa-cloud-sun-rain"></i> <span>Thời tiết & Môi trường</span></a>
                    <a href="#"><i class="fa-solid fa-seedling"></i> <span>Nhật ký canh tác</span></a>
                    <a href="market-price.html"><i class="fa-solid fa-chart-line"></i> <span>Thị trường & Giá</span></a>
                    <a href="news.html" class="active"><i class="fa-regular fa-newspaper"></i> <span>Tin tức Nông nghiệp</span></a>
                    <a href="marketplace.html"><i class="fa-solid fa-handshake"></i> <span>Giao thương</span></a>
                    <a href="#"><i class="fa-solid fa-book"></i> <span>Cẩm nang Kỹ thuật</span></a>
                    <a href="profile.html"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
                </nav>
                <div style="margin-top: auto; padding: 20px 12px;">
                    <a href="index.html" id="logout-btn" style="color: var(--red-500); text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-weight: 500;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="logout-text">Đăng xuất</span></a>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="dash-main">
            <!-- Topbar -->
            <header class="dash-topbar">
                <div class="page-title">
                    <h3>Tin tức Nông nghiệp</h3>
                    <p>Cập nhật kỹ thuật canh tác và thông tin thị trường mới nhất</p>
                </div>
                <div class="dash-controls">
                    <button class="btn btn-icon" onclick="loadPublicNews()"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </header>
            
            <div style="padding: 32px; overflow-y: auto; height: calc(100% - 85px);">
                <div class="news-grid" id="news-container">
                    <!-- Loading state -->
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--slate-500);">
                        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                        <p class="mt-20">Đang tải tin tức...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('token');
            if (token && user) {
                const nameDisplay = document.getElementById('user-name-display');
                const sidebarAvatar = document.getElementById('sidebar-avatar');
                if(nameDisplay) nameDisplay.innerText = user.display_name || user.email.split('@')[0];
                if(sidebarAvatar && user.avatar) sidebarAvatar.src = user.avatar;
                
                if(user.role === 'admin') {
                    document.getElementById('user-role-display').innerText = 'Quản trị viên';
                    document.getElementById('user-role-display').style.background = 'var(--red-100)';
                    document.getElementById('user-role-display').style.color = 'var(--red-700)';
                    const nav = document.querySelector('.dash-nav');
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin-products.html';
                    adminLink.innerHTML = '<i class="fa-solid fa-user-tie"></i> <span>Vào trang quản trị</span>';
                    nav.appendChild(adminLink);
                }
            }

            document.getElementById('logout-btn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            });

            // Sidebar Toggle Logic
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.querySelector('.dash-sidebar');
            if (sidebarToggleBtn && sidebar) {
                if (localStorage.getItem('sidebarState') === 'collapsed') { sidebar.classList.add('collapsed'); }
                sidebarToggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarState', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
                });
            }

            loadPublicNews();
        });

        // Strip HTML to get short text
        function stripHtml(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        async function loadPublicNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--slate-500);"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i><p class="mt-20">Đang tải tin tức...</p></div>';
            
            try {
                const res = await fetch('http://localhost:3000/api/news');
                if (res.ok) {
                    const data = await res.json();
                    container.innerHTML = '';
                    if (data.length === 0) {
                        container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--slate-500);">Không có bài viết nào được tìm thấy.</div>';
                        return;
                    }

                    data.forEach(news => {
                        const date = new Date(news.created_at).toLocaleDateString('vi-VN');
                        const thumb = news.thumbnail_url || 'https://images.unsplash.com/photo-1592982537447-6f2b6e0c6511?w=800&q=80';
                        const textSnippet = stripHtml(news.snippet);
                        
                        container.innerHTML += `
                            <a href="news-detail.html?id=${news.id}" class="news-card">
                                <div class="nc-img" style="background-image: url('${thumb}');"></div>
                                <div class="nc-content">
                                    <div class="nc-meta">
                                        <span><i class="fa-regular fa-calendar"></i> ${date}</span>
                                        <span><i class="fa-solid fa-pencil"></i> ${news.author_name}</span>
                                    </div>
                                    <h3 class="nc-title" title="${news.title}">${news.title}</h3>
                                    <p class="nc-desc">${textSnippet}</p>
                                    <span class="nc-readmore">Đọc tiếp <i class="fa-solid fa-arrow-right"></i></span>
                                </div>
                            </a>
                        `;
                    });
                }
            } catch (err) {
                container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--red-500);">Lỗi tải tin tức! Vui lòng thử lại sau.</div>';
            }
        }
    </script>
</body>
</html>
