<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao thương - Sổ tay Nông dân số</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(3px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .modal.show { display: flex; opacity: 1; }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%; max-width: 500px;
            margin: 0 15px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            transform: translateY(-20px);
            transition: transform 0.2s ease;
            position: relative;
        }
        .modal.show .modal-content { transform: translateY(0); }
        .close-modal, .close-chat-modal, .close-inbox-modal { position: absolute; top: 16px; right: 16px; font-size: 1.2rem; cursor: pointer; color: var(--slate-500); z-index: 10; }
        .close-modal:hover, .close-chat-modal:hover, .close-inbox-modal:hover { color: var(--red-500); }

        .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 8px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f1f5f9; }
        .inbox-item:hover { background: #f8fafc; }
        .inbox-item img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
        .inbox-item-info { flex: 1; }
        .inbox-item-name { font-weight: 600; color: #1e293b; margin-bottom: 2px; }
        .inbox-item-role { font-size: 0.8rem; color: #64748b; }

        .btn-outline-danger { border: 1px solid var(--red-400); color: var(--red-500); background: white; border-radius: 6px; cursor: pointer; padding: 4px 10px; transition: all 0.2s; }
        .btn-outline-danger:hover { background: var(--red-50); color: var(--red-600); border-color: var(--red-500); }
        .btn-edit-post, .btn-delete-post { font-size: 0.85rem; }
        .btn-edit-post { border: 1px solid var(--slate-300); color: var(--slate-600); background: white; border-radius: 6px; cursor: pointer; padding: 4px 10px; transition: all 0.2s; }
        .btn-edit-post:hover { background: var(--emerald-50); color: var(--emerald-600); border-color: var(--emerald-400); }

        .market-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .market-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .mc-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e2e8f0;
        }
        .mc-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .mc-tag-sell { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-bottom: 8px;}
        .mc-tag-buy { background: #ffedd5; color: #9a3412; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-bottom: 8px;}
        .mc-title { font-size: 1.1rem; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .mc-info { font-size: 0.9rem; color: #64748b; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .mc-verified { color: #2563eb; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 4px; margin-top: 5px;}
        .mc-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; }
        .chat-self { background: var(--emerald-500); color: white; align-self: flex-end; border-bottom-right-radius: 2px;}
        .chat-other { background: white; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);}

        .marketplace-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: calc(100vh - 180px);
        }

        .marketplace-filters {
            display: grid;
            grid-template-columns: repeat(4, minmax(170px, 1fr));
            gap: 12px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .marketplace-filters .control-group {
            min-width: 0;
        }

        .marketplace-filters label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        .marketplace-feed-wrap {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 16px;
            height: calc(100vh - 260px);
            min-height: 560px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #marketplace-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        @media (max-width: 1200px) {
            .marketplace-filters {
                grid-template-columns: repeat(2, minmax(170px, 1fr));
            }

            .marketplace-feed-wrap {
                height: auto;
                max-height: 78vh;
            }
        }

        @media (max-width: 768px) {
            .marketplace-layout {
                min-height: auto;
            }

            .marketplace-filters {
                grid-template-columns: 1fr;
            }

            .marketplace-feed-wrap {
                height: auto;
                max-height: none;
                overflow: visible;
                padding: 0;
                background: transparent;
                box-shadow: none;
            }
        }
    </style>
</head>
<body class="dashboard-page">
    <div class="saas-dashboard">
        <!-- Sidebar -->
        <aside class="dash-sidebar">
            <button id="sidebarToggleBtn" class="floating-toggle-btn"><i class="fa-solid fa-angle-left" id="toggleIcon"></i></button>
            <div class="sidebar-content-wrapper">
                <div class="dash-profile">
                    <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Avatar">
                    <div class="dash-profile-info">
                        <strong id="user-name-display">Người dùng</strong>
                        <span class="badge badge-farmer" id="user-role-display">Khách</span>
                    </div>
                </div>
                <nav class="dash-nav">
                    <a href="weather.html"><i class="fa-solid fa-cloud-sun-rain"></i> <span>Thời tiết & Môi trường</span></a>
                    <a href="market-price.html"><i class="fa-solid fa-chart-line"></i> <span>Thị trường & Giá</span></a>
                    <a href="news.html"><i class="fa-regular fa-newspaper"></i> <span>Tin tức Nông nghiệp</span></a>
                    <a href="marketplace.html" class="active"><i class="fa-solid fa-handshake"></i> <span>Giao thương</span></a>
                    <a href="profile.html"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
                </nav>
                <div style="margin-top: auto; padding: 20px 12px;">
                    <a href="index.html" id="logout-btn" style="color: var(--red-500); text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-weight: 500;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="logout-text">Đăng xuất</span></a>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="dash-main">
            <!-- Topbar -->
            <header class="dash-topbar" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="page-title">
                    <h3>Chợ Nông sản (Giao thương)</h3>
                    <p>Khám phá thị trường mua bán nông sản trực tiếp</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-inbox" class="btn btn-outline" style="background: white; position: relative;"><i class="fa-solid fa-envelope"></i> Hộp thư <span id="inbox-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: var(--red-500); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold;">0</span></button>
                    <button id="btn-post-ad" class="btn btn-primary" style="display: none;"><i class="fa-solid fa-plus"></i> <span id="post-ad-text">Đăng tin</span></button>
                </div>
            </header>

            <div class="marketplace-layout">
                <!-- Filters -->
                <div class="widget marketplace-filters">
                    <div class="control-group">
                        <label>Loại tin:</label>
                        <select id="filter-type" class="dash-select">
                            <option value="">Tất cả</option>
                            <option value="sell">Cần bán (Từ nhà vườn)</option>
                            <option value="buy">Cần mua (Từ thương lái)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Người đăng:</label>
                        <select id="filter-owner" class="dash-select">
                            <option value="">Tất cả</option>
                            <option value="mine">Tin của tôi</option>
                            <option value="others">Tin người khác</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Loại cây trồng:</label>
                        <select id="filter-category" class="dash-select">
                            <option value="">Tất cả</option>
                            <option value="Lúa gạo">Lúa gạo</option>
                            <option value="Trái cây">Trái cây</option>
                            <option value="Rau củ">Rau củ</option>
                            <option value="Cây công nghiệp">Cây công nghiệp</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Khu vực (Tỉnh/Thành):</label>
                        <input type="text" id="filter-location" list="provinceList" class="form-control" placeholder="Tìm theo khu vực...">
                    </div>
                </div>

                <!-- Feed Grid -->
                <div class="marketplace-feed-wrap">
                    <div id="marketplace-feed">
                        <!-- Feed items will be populated by JS -->
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Đăng tin -->
    <div id="postModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-modal"><i class="fa-solid fa-xmark"></i></span>
            <h3 style="margin-bottom: 20px;" id="post-modal-title">Đăng tin mới</h3>
            <form id="post-form" style="display: flex; flex-direction: column; gap: 15px;">
                <div class="form-group">
                    <label>Tên nông sản <span style="color: red;">*</span></label>
                    <input type="text" id="post-name" class="form-control" required placeholder="Ví dụ: Gạo ST25 chuẩn xuất khẩu">
                </div>
                <div class="form-group">
                    <label>Phân loại nhóm</label>
                    <select id="post-category" class="dash-select" style="width: 100%;">
                        <option value="Lúa gạo">Lúa gạo</option>
                        <option value="Trái cây">Trái cây</option>
                        <option value="Rau củ">Rau củ</option>
                        <option value="Cây công nghiệp">Cây công nghiệp</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sản lượng / Hàng yêu cầu</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" step="any" id="post-quantity-value" class="form-control" style="flex: 2" placeholder="Ví dụ: 100..." required>
                        <select id="post-quantity-unit" class="dash-select" style="flex: 1">
                            <option value="Tấn">Tấn</option>
                            <option value="Tạ">Tạ</option>
                            <option value="Yến">Yến</option>
                            <option value="Kg">Kg</option>
                            <option value="Gram">Gram</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Khu vực / Địa điểm canh tác/thu mua</label>
                    <input type="text" id="post-location" list="provinceList" class="form-control" placeholder="Cần Thơ, hoặc Đồng Tháp...">
                </div>
                <div class="form-group">
                    <label>Mô tả chi tiết</label>
                    <textarea id="post-desc" class="form-control" rows="4" placeholder="Nêu rõ yêu cầu chất lượng, thời gian, phương thức..."></textarea>
                </div>
                <div class="form-group">
                    <label>Hình ảnh Minh họa (Tùy chọn)</label>
                    <input type="url" id="post-image-url" class="form-control" placeholder="Nhập đường dẫn liên kết (URL) của ảnh...">
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 10px;" id="submit-post-btn">Đăng tin</button>
            </form>
        </div>
    </div>

    <!-- Modal: Inbox -->
    <div id="inboxModal" class="modal">
        <div class="modal-content" style="max-width: 500px; padding: 0;">
            <div class="chat-header" style="background: var(--blue-600); color: white; padding: 15px 20px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.1rem;"><i class="fa-solid fa-envelope"></i> Hộp thư của bạn</h3>
                <span class="close-inbox-modal" style="cursor: pointer; font-size: 1.2rem;; color: white;"><i class="fa-solid fa-xmark"></i></span>
            </div>
            <div id="inbox-list" style="height: 400px; overflow-y: auto; padding: 10px; background: white; border-radius: 0 0 12px 12px;">
                <!-- Conversation items go here -->
                <div style="text-align: center; color: #94a3b8; margin-top: 50px;">Đang tải hộp thư...</div>
            </div>
        </div>
    </div>

    <!-- Modal: Chat -->
    <div id="chatModal" class="modal">
        <div class="modal-content" style="max-width: 500px; padding: 0;">
            <div class="chat-header" style="background: var(--emerald-600); color: white; padding: 15px 20px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="chat-partner-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none;">
                    <div>
                        <h3 style="margin: 0; font-size: 1.1rem;" id="chat-partner-name">Nhắn tin</h3>
                        <small style="opacity: 0.8;" id="chat-partner-role">--</small>
                    </div>
                </div>
                <span class="close-chat-modal" style="cursor: pointer; font-size: 1.2rem;"><i class="fa-solid fa-xmark"></i></span>
            </div>
            <div id="chat-messages" style="height: 350px; overflow-y: auto; padding: 20px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px;">
                <!-- Chat bubbles go here -->
            </div>
            <div class="chat-input" style="padding: 15px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; border-radius: 0 0 12px 12px;">
                <input type="hidden" id="active-chat-partner-id">
                <input type="text" id="chat-input-text" class="form-control" style="flex: 1;" placeholder="Nhập tin nhắn...">
                <button id="send-chat-btn" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="js/script.js"></script>
    <script src="js/marketplace.js"></script>
</body>
</html>
