<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài viết - Sổ tay Nông dân số</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Quill Snow CSS (for rendering rich text nicely) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .news-detail-container {
            max-width: 800px; margin: 0 auto; padding: 40px 24px;
        }
        .nd-header { margin-bottom: 30px; text-align: center; }
        .nd-title { font-size: 2.2rem; line-height: 1.3; font-weight: 800; color: var(--slate-900); margin-bottom: 16px; }
        .nd-meta { display: flex; justify-content: center; gap: 20px; color: var(--slate-500); font-size: 0.95rem; }
        .nd-meta span { display: flex; align-items: center; gap: 6px; }
        .nd-cover { width: 100%; height: 400px; border-radius: var(--radius-xl); object-fit: cover; margin-bottom: 40px; box-shadow: var(--shadow-md); display: none; }
        .nd-content { font-size: 1.1rem; line-height: 1.8; color: var(--slate-800); }
        .nd-content img { max-width: 100%; height: auto; border-radius: var(--radius-md); margin: 20px 0; }
        .nd-content a { color: var(--blue-600); text-decoration: underline; }
        /* Style adjustments for Quill content inside .ql-editor */
        .ql-editor { padding: 0; overflow-y: visible; font-family: inherit; font-size: 1.1rem; }
        
        .back-btn { 
            display: inline-flex; align-items: center; gap: 8px; color: var(--slate-600); 
            text-decoration: none; font-weight: 600; font-size: 0.95rem; margin-bottom: 24px;
            transition: var(--transition);
        }
        .back-btn:hover { color: var(--emerald-600); transform: translateX(-5px); }
    </style>
</head>
<body class="dashboard-page">
    <div class="saas-dashboard">
        <!-- Sidebar -->
        <aside class="dash-sidebar">
            <button id="sidebarToggleBtn" class="floating-toggle-btn"><i class="fa-solid fa-angle-left" id="toggleIcon"></i></button>
            <div class="sidebar-content-wrapper">
                <div class="dash-profile">
                    <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Avatar">
                    <div class="dash-profile-info">
                        <strong id="user-name-display">Người dùng</strong>
                        <span class="badge badge-farmer" id="user-role-display">Nông dân</span>
                    </div>
                </div>
                <nav class="dash-nav">
                    <a href="dashboard.html"><i class="fa-solid fa-house"></i> <span>Tổng quan</span></a>
                    <a href="weather.html"><i class="fa-solid fa-cloud-sun-rain"></i> <span>Thời tiết & Môi trường</span></a>
                    <a href="#"><i class="fa-solid fa-seedling"></i> <span>Nhật ký canh tác</span></a>
                    <a href="market-price.html"><i class="fa-solid fa-chart-line"></i> <span>Thị trường & Giá</span></a>
                    <a href="news.html" class="active"><i class="fa-regular fa-newspaper"></i> <span>Tin tức Nông nghiệp</span></a>
                    <a href="marketplace.html"><i class="fa-solid fa-handshake"></i> <span>Giao thương</span></a>
                    <a href="#"><i class="fa-solid fa-book"></i> <span>Cẩm nang Kỹ thuật</span></a>
                    <a href="profile.html"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
                </nav>
                <div style="margin-top: auto; padding: 20px 12px;">
                    <a href="index.html" id="logout-btn" style="color: var(--red-500); text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-weight: 500;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="logout-text">Đăng xuất</span></a>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="dash-main" style="overflow-y: auto;">
            <!-- Topbar -->
            <header class="dash-topbar" style="position: sticky; top: 0; z-index: 100;">
                <div class="page-title">
                    <h3>Chi tiết bài viết</h3>
                </div>
            </header>
            
            <div class="news-detail-container" id="news-detail-content">
                <div style="text-align: center; padding: 40px; color: var(--slate-500);">
                    <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                    <p class="mt-20">Đang tải...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                const nameDisplay = document.getElementById('user-name-display');
                const sidebarAvatar = document.getElementById('sidebar-avatar');
                if(nameDisplay) nameDisplay.innerText = user.display_name || user.email.split('@')[0];
                if(sidebarAvatar && user.avatar) sidebarAvatar.src = user.avatar;
                
                if(user.role === 'admin') {
                    document.getElementById('user-role-display').innerText = 'Quản trị viên';
                    document.getElementById('user-role-display').style.background = 'var(--red-100)';
                    document.getElementById('user-role-display').style.color = 'var(--red-700)';
                    const nav = document.querySelector('.dash-nav');
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin-products.html';
                    adminLink.innerHTML = '<i class="fa-solid fa-user-tie"></i> <span>Vào trang quản trị</span>';
                    nav.appendChild(adminLink);
                }
            }

            document.getElementById('logout-btn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            });

            // Sidebar Toggle
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.querySelector('.dash-sidebar');
            if (sidebarToggleBtn && sidebar) {
                if (localStorage.getItem('sidebarState') === 'collapsed') { sidebar.classList.add('collapsed'); }
                sidebarToggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarState', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
                });
            }

            loadNewsDetail();
        });

        async function loadNewsDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');
            const container = document.getElementById('news-detail-content');

            if (!newsId) {
                container.innerHTML = '<a href="news.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Quay lại</a><div style="color: var(--red-500); text-align: center;">Không tìm thấy ID bài viết!</div>';
                return;
            }

            try {
                const response = await fetch(`/api/news/${newsId}`);
                if (response.ok) {
                    const data = await response.json();
                    const date = new Date(data.created_at).toLocaleDateString('vi-VN', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit'
                    });

                    let imgHtml = '';
                    if (data.thumbnail_url) {
                        imgHtml = `<img src="${data.thumbnail_url}" class="nd-cover" style="display:block;" alt="Thumbnail">`;
                    }

                    container.innerHTML = `
                        <a href="news.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a>
                        <div class="nd-header">
                            <h1 class="nd-title">${data.title}</h1>
                            <div class="nd-meta">
                                <span><i class="fa-regular fa-calendar"></i> ${date}</span>
                                <span><i class="fa-solid fa-user-pen"></i> ${data.author_name}</span>
                            </div>
                        </div>
                        ${imgHtml}
                        <div class="ql-snow">
                            <div class="ql-editor p-0 nd-content">
                                ${data.content}
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<a href="news.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Quay lại</a><div style="color: var(--red-500); text-align: center;">Bài viết không tồn tại hoặc đã bị ẩn.</div>';
                }
            } catch (err) {
                container.innerHTML = '<a href="news.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Quay lại</a><div style="color: var(--red-500); text-align: center;">Lỗi tải chi tiết bài viết!</div>';
            }
        }
    </script>
</body>
</html>
