<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Sổ tay Nông dân số</title>
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px var(--slate-200), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--slate-100);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .profile-avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--emerald-500);
        }
        .profile-form-group {
            margin-bottom: 16px;
        }
        .profile-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--slate-700);
        }
        .profile-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--slate-300);
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--slate-800);
            transition: all 0.2s ease;
        }
        .profile-input:focus {
            outline: none;
            border-color: var(--emerald-500);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="dashboard-page">
    <div class="saas-dashboard">
        <!-- Sidebar -->
        <aside class="dash-sidebar">
            <button id="sidebarToggleBtn" class="floating-toggle-btn"><i class="fa-solid fa-angle-left" id="toggleIcon"></i></button>
            <div class="sidebar-content-wrapper">
                <div class="dash-profile">
                    <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Avatar">
                    <div class="dash-profile-info">
                        <strong id="user-name-display">Nguyễn Văn A</strong>
                        <span class="badge badge-farmer" id="user-role-display">Nông dân</span>
                    </div>
                </div>
                <nav class="dash-nav">
                    <a href="dashboard.html"><i class="fa-solid fa-house"></i> <span>Tổng quan</span></a>
                    <a href="weather.html"><i class="fa-solid fa-cloud-sun-rain"></i> <span>Thời tiết & Môi trường</span></a>
                    <a href="#"><i class="fa-solid fa-seedling"></i> <span>Nhật ký canh tác</span></a>
                    <a href="market-price.html"><i class="fa-solid fa-chart-line"></i> <span>Thị trường & Giá</span></a>
                    <a href="news.html"><i class="fa-regular fa-newspaper"></i> <span>Tin tức Nông nghiệp</span></a>
                    <a href="marketplace.html"><i class="fa-solid fa-handshake"></i> <span>Giao thương</span></a>
                    <a href="#"><i class="fa-solid fa-book"></i> <span>Cẩm nang Kỹ thuật</span></a>
                    <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
                </nav>
                <div style="margin-top: auto; padding: 20px 12px;">
                    <a href="index.html" id="logout-btn" style="color: var(--red-500); text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-weight: 500;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="logout-text">Đăng xuất</span></a>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="dash-main">
            <header class="dash-topbar" style="margin-bottom: 24px;">
                <div class="page-title">
                    <h3>Hồ sơ cá nhân</h3>
                    <p>Chỉnh sửa thông tin tài khoản của bạn</p>
                </div>
            </header>
            
            <div class="profile-container">
                <form id="profile-form">
                    <div class="profile-header">
                        <img id="current-avatar-preview" src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Avatar" class="profile-avatar-preview">
                        <div>
                            <h4 id="profile-display-name">Nguyễn Văn A</h4>
                            <span class="badge badge-farmer" id="profile-role">Nông dân</span>
                        </div>
                    </div>

                    <div id="profile-alert" style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 16px;"></div>

                    <div class="profile-form-group">
                        <label for="email_display">Địa chỉ Email</label>
                        <input type="email" id="email_display" class="profile-input" style="background-color: var(--slate-50); color: var(--slate-500); cursor: not-allowed;" readonly>
                    </div>

                    <div class="profile-form-group">
                        <label for="display_name">Tên hiển thị</label>
                        <input type="text" id="display_name" class="profile-input" placeholder="Nhập tên hiển thị mới">
                    </div>

                    <div class="profile-form-group">
                        <label for="avatar_url">Đường dẫn ảnh đại diện (URL)</label>
                        <input type="text" id="avatar_url" autocomplete="off" name="avatar_url_prevent_autofill" class="profile-input" placeholder="https://example.com/avatar.jpg">
                    </div>

                    <div class="profile-form-group" style="position: relative;">
                        <label for="password">Mật khẩu mới (Để trống nếu không đổi)</label>
                        <input type="password" id="password" autocomplete="new-password" class="profile-input" placeholder="Nhập mật khẩu mới">
                    </div>

                    <div style="margin-top: 32px; display:flex; justify-content: flex-end;">
                        <button type="submit" class="btn btn-primary" id="save-profile-btn" style="padding: 14px 32px; font-size: 1.05rem; border-radius: 10px; font-weight: 600;">
                            Lưu thông tin
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Custom Script -->
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('token');
            if (!token || !user) {
                window.location.href = 'login.html';
                return;
            }
            if (user.role === 'admin') {
                document.body.classList.add('admin-theme');
            }

            const defaultAvatar = 'https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80';
            
            // Populate fields
            document.getElementById('email_display').value = user.email || '';
            document.getElementById('display_name').value = user.display_name || '';
            document.getElementById('avatar_url').value = user.avatar || '';
            document.getElementById('profile-display-name').textContent = user.display_name || user.email;

            // Handle Role Display
            const roleDisplays = [document.getElementById('user-role-display'), document.getElementById('profile-role')];
            roleDisplays.forEach(el => {
                if(el) {
                    if (user.role === 'admin') {
                        el.textContent = 'Quản trị viên';
                        el.className = 'badge';
                        el.style.background = 'var(--red-100)';
                        el.style.color = 'var(--red-700)';
                    } else {
                        el.textContent = 'Nông dân';
                        el.className = 'badge badge-farmer';
                        el.removeAttribute('style');
                    }
                }
            });

            // Handle Sidebar Navigation Dynamically
            const sidebarNav = document.querySelector('.dash-nav');
            const currentPage = window.location.pathname.split('/').pop() || 'profile.html';
            const isAdminContextPage = currentPage.startsWith('admin-') || currentPage === 'profile.html';
            const adminEntryLink = '<a href="admin-products.html"><i class="fa-solid fa-user-tie"></i> <span>Vào trang quản trị</span></a>';
            if (sidebarNav) {
                if (user.role === 'admin') {
                    sidebarNav.innerHTML = `

                        <a href="admin-farmers.html"><i class="fa-solid fa-users"></i> <span>Quản lý Nông dân</span></a>
                        <a href="admin-products.html"><i class="fa-solid fa-seedling"></i> <span>Quản lý Nông sản</span></a>
                        <a href="admin-news.html"><i class="fa-regular fa-newspaper"></i> <span>Quản lý Tin tức</span></a>
                        <a href="#"><i class="fa-solid fa-signs-post"></i> <span>Quản lý Báo cáo</span></a>
                        <a href="#"><i class="fa-solid fa-gear"></i> <span>Cài đặt hệ thống</span></a>
                        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
                        ${isAdminContextPage ? '' : adminEntryLink}
                        <a href="dashboard.html"><i class="fa-solid fa-house-user"></i> <span>Trang chủ Nông dân</span></a>
                    `;
                } else {
                    sidebarNav.innerHTML = `
                        <a href="dashboard.html"><i class="fa-solid fa-house"></i> <span>Tổng quan</span></a>
                        <a href="weather.html"><i class="fa-solid fa-cloud-sun-rain"></i> <span>Thời tiết & Môi trường</span></a>
                        <a href="#"><i class="fa-solid fa-seedling"></i> <span>Nhật ký canh tác</span></a>
                        <a href="market-price.html"><i class="fa-solid fa-chart-line"></i> <span>Thị trường & Giá</span></a>
                        <a href="news.html"><i class="fa-regular fa-newspaper"></i> <span>Tin tức Nông nghiệp</span></a>
                        <a href="marketplace.html"><i class="fa-solid fa-handshake"></i> <span>Giao thương</span></a>
                        <a href="#"><i class="fa-solid fa-book"></i> <span>Cẩm nang Kỹ thuật</span></a>
                        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
                    `;
                }
            }
            
            const renderAvatar = () => {
                const avatarSrc = user.avatar ? user.avatar : defaultAvatar;
                document.getElementById('current-avatar-preview').src = avatarSrc;
                
                const sidebarAvatar = document.getElementById('sidebar-avatar');
                if(sidebarAvatar) sidebarAvatar.src = avatarSrc;
            };
            renderAvatar();

            // Handle sidebar info
            const nameDisplay = document.getElementById('user-name-display');
            if(nameDisplay) nameDisplay.innerText = user.display_name || user.email.split('@')[0];

            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('save-profile-btn');
                const alertBox = document.getElementById('profile-alert');
                
                const displayName = document.getElementById('display_name').value.trim();
                const avatarUrl = document.getElementById('avatar_url').value.trim();
                const password = document.getElementById('password').value;

                const body = {};
                if (displayName) body.display_name = displayName;
                // Allow empty string to reset avatar
                if (avatarUrl !== undefined) body.avatar = avatarUrl;
                if (password) body.password = password;

                try {
                    btn.disabled = true;
                    btn.textContent = 'Đang lưu...';
                    
                    const res = await fetch('/api/auth/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(body)
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        alertBox.style.display = 'block';
                        alertBox.style.backgroundColor = '#d1fae5';
                        alertBox.style.color = '#065f46';
                        alertBox.textContent = 'Cập nhật hồ sơ thành công!';
                        
                        // Update local storage user data
                        user = { ...user, ...data.user };
                        localStorage.setItem('user', JSON.stringify(user));
                        
                        // Update UI
                        document.getElementById('profile-display-name').textContent = user.display_name;
                        if(nameDisplay) nameDisplay.innerText = user.display_name;
                        document.getElementById('password').value = '';
                        renderAvatar();
                    } else {
                        throw new Error(data.error || 'Cập nhật thất bại');
                    }
                } catch(error) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#fee2e2';
                    alertBox.style.color = '#991b1b';
                    alertBox.textContent = error.message;
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Lưu thông tin';
                    
                    setTimeout(() => {
                        alertBox.style.display = 'none';
                    }, 3000);
                }
            });

            // Logout
            const logoutBtn = document.getElementById('logout-btn');
            if(logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                });
            }

            // Sidebar Toggle
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.querySelector('.dash-sidebar');
            if (sidebarToggleBtn && sidebar) {
                if (localStorage.getItem('sidebarState') === 'collapsed') {
                    sidebar.classList.add('collapsed');
                }
                sidebarToggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarState', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
                });
            }
        });
    </script>
</body>
</html>
