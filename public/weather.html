<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môi trường & Thời tiết - Sổ tay Nông dân số</title>
    <!-- Fonts: Inter for professional SaaS look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .weather-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 85px);
            overflow-y: auto; /* Cho phép cuộn trang chính */
        }

        .weather-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--slate-200);
            display: flex;
            flex-direction: column;
        }

        .weather-desc {
            color: var(--slate-600);
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .weather-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }
        
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-400);
        }

        .weather-controls select, .search-box input[type="text"] {
            height: 48px;
            border-radius: var(--radius-md);
            border: 1px solid var(--slate-300);
            font-size: 1rem;
            font-family: inherit;
            color: var(--slate-800);
            background: var(--slate-50);
            transition: var(--transition);
            outline: none;
            width: 100%;
        }
        
        .weather-controls select {
            padding: 0 16px;
            flex: 1;
            min-width: 200px;
            max-width: 250px;
        }
        
        .search-box input[type="text"] {
            padding: 0 16px 0 40px;
        }

        .weather-controls select:focus, .search-box input[type="text"]:focus {
            border-color: var(--emerald-500);
            box-shadow: 0 0 0 3px var(--emerald-100);
            background: white;
        }

        .weather-controls button, .weather-controls a.link-btn {
            height: 48px;
            border-radius: var(--radius-md);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            gap: 8px;
            padding: 0 24px;
        }

        .btn-prev-next {
            background: white;
            border: 1px solid var(--slate-300);
            color: var(--slate-700);
        }

        .btn-prev-next:hover {
            background: var(--slate-50);
            color: var(--emerald-600);
            border-color: var(--emerald-500);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px var(--slate-200);
        }

        /* PREMIUM WEATHER HERO */
        .current-weather-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            background: linear-gradient(135deg, #fafff7 0%, #54ec87 100%);
            color: white;
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
            position: relative;
            overflow: hidden;
        }

        .current-weather-hero::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .hero-left h2 {
            margin-bottom: 8px;
            font-size: 2.2rem;
            color: rgb(66, 66, 66);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .cw-date {
            font-size: 1rem;
            color: #475569;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .temp-display {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 8px;
            margin-top: 8px;
        }

        .temp-display i {
            font-size: 5rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .temp-value {
            font-size: 5rem;
            font-weight: 800;
            color: rgb(66, 66, 66);
            line-height: 1;
            letter-spacing: -2px;
        }
        
        .temp-value small {
            font-size: 2rem;
            position: relative;
            top: -30px;
            font-weight: 600;
            color: #64748b;
        }
        
        .weather-text {
            font-size: 1.5rem !important;
            font-weight: 600 !important;
            color: #334155 !important;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .hero-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 280px;
            z-index: 2;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #1e293b;
            transition: all 0.3s ease;
        }
        
        .stat-box:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateX(-5px);
        }

        .sb-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.8) !important;
            color: #10b981 !important;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .stat-box strong {
            display: block;
            font-size: 1.1rem;
            color: #0f172a;
            font-weight: 700;
        }

        .stat-box small {
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
        }

        .forecast-card {
            background: white;
            border: 1px solid var(--slate-200);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .forecast-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--emerald-300);
        }

        .forecast-card.today {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-color: #86efac;
            box-shadow: 0 4px 15px rgba(134, 239, 172, 0.3);
        }

        .fc-day {
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .fc-date {
            font-size: 0.8rem;
            color: var(--slate-500);
            margin-bottom: 16px;
        }

        .fc-icon {
            font-size: 2.4rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }
        
        .forecast-card:hover .fc-icon {
            transform: scale(1.1);
        }

        .fc-temps {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            padding-top: 12px;
            border-top: 1px solid var(--slate-100);
        }
        
        .forecast-card.today .fc-temps {
            border-top-color: #bbf7d0;
        }

        .fc-max { color: var(--slate-900); }
        .fc-min { color: var(--slate-400); }

        @media (max-width: 768px) {
            .current-weather-hero {
                flex-direction: column;
            }
        }


    </style>
</head>
<body class="dashboard-page">
    <div class="saas-dashboard">
        <!-- Sidebar -->
        <aside class="dash-sidebar">
            <button id="sidebarToggleBtn" class="floating-toggle-btn"><i class="fa-solid fa-angle-left" id="toggleIcon"></i></button>
            
            <div class="sidebar-content-wrapper">
                <div class="dash-profile">
                <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Avatar">
                <div class="dash-profile-info">
                    <strong id="user-name-display">Nguyễn Văn A</strong>
                    <span class="badge badge-farmer" id="user-role-display">Nông dân</span>
                </div>
            </div>
            <nav class="dash-nav">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> <span>Tổng quan</span></a>
                <a href="weather.html" class="active"><i class="fa-solid fa-cloud-sun-rain"></i> <span>Thời tiết & Môi trường</span></a>
                <a href="#"><i class="fa-solid fa-seedling"></i> <span>Nhật ký canh tác</span></a>
                <a href="market-price.html"><i class="fa-solid fa-chart-line"></i> <span>Thị trường & Giá</span></a>
                <a href="news.html"><i class="fa-regular fa-newspaper"></i> <span>Tin tức Nông nghiệp</span></a>
                <a href="marketplace.html"><i class="fa-solid fa-handshake"></i> <span>Giao thương</span></a>
                <a href="#"><i class="fa-solid fa-book"></i> <span>Cẩm nang Kỹ thuật</span></a>
                <a href="profile.html"><i class="fa-solid fa-user"></i> <span>Hồ sơ cá nhân</span></a>
            </nav>
                <div style="margin-top: auto; padding: 20px 12px;">
                    <a href="index.html" id="logout-btn" style="color: var(--red-500); text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-weight: 500;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="logout-text">Đăng xuất</span></a>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="dash-main">
            <!-- Topbar -->
            <header class="dash-topbar">
                <div class="page-title">
                    <h3>Thời tiết & Môi trường</h3>
                    <p>Cập nhật dữ liệu khí hậu 63 tỉnh thành trực tiếp</p>
                </div>
                <div class="dash-controls">
                    <button class="btn btn-icon"><i class="fa-solid fa-bell"></i><span class="notify-dot"></span></button>
                    <a href="dashboard.html" class="btn btn-outline-emerald btn-sm"><i class="fa-solid fa-arrow-left"></i> Về bảng T.Quan</a>
                </div>
            </header>
            
            <div class="weather-content">
                <div class="weather-card">
                    <div class="weather-controls">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                            <input type="text" id="provinceSearch" list="provinceList" placeholder="Tìm kiếm tỉnh...">
                            <datalist id="provinceList"></datalist>
                        </div>
                        <select id="provinceSelect"></select>
                        <button id="prevBtn" class="btn-prev-next"><i class="fa-solid fa-chevron-left"></i> Tỉnh trước</button>
                        <button id="nextBtn" class="btn-prev-next">Tỉnh sau <i class="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <!-- Fetched and Rendered by js/weather.js -->
                    <div id="native-weather-container">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Script -->
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('token');
            if (!token || !user) {
                window.location.href = 'login.html';
                return;
            }

            const nameDisplay = document.getElementById('user-name-display');
            const sidebarAvatar = document.getElementById('sidebar-avatar');
            if(user) {
                if(nameDisplay) nameDisplay.innerText = user.display_name || (user.email ? user.email.split('@')[0] : 'Người dùng');
                if(sidebarAvatar && user.avatar) sidebarAvatar.src = user.avatar;
                
                if(user.role === 'admin') {
                    const roleDisplay = document.getElementById('user-role-display');
                    if (roleDisplay) {
                        roleDisplay.innerText = 'Quản trị viên';
                        roleDisplay.className = 'badge';
                        roleDisplay.style.background = 'var(--red-100)';
                        roleDisplay.style.color = 'var(--red-700)';
                    }
                    
                    const nav = document.querySelector('.dash-nav');
                    if (nav) {
                        const adminLink = document.createElement('a');
                        adminLink.href = 'admin-products.html';
                        adminLink.innerHTML = '<i class="fa-solid fa-user-tie"></i> <span>Vào trang quản trị</span>';
                        nav.appendChild(adminLink);
                    }
                }
            }

            const logoutBtn = document.getElementById('logout-btn');
            if(logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                });
            }

            // Sidebar Toggle Logic
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.querySelector('.dash-sidebar');
            if (sidebarToggleBtn && sidebar) {
                if (localStorage.getItem('sidebarState') === 'collapsed') {
                    sidebar.classList.add('collapsed');
                }
                sidebarToggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarState', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
                });
            }
        });
    </script>
    <script src="js/weather.js"></script>
</body>
</html>
